services:
  - type: web
    name: merys-toys-conferencia
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: merys-toys-db
          property: connectionString
      - key: ADMIN_USER
        value: adm
      - key: ADMIN_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: merys-toys-db
    plan: free
